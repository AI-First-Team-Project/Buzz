services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ai-server:
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    image: buzz-ai-server:local
    ports:
      - "8000:8000"
    environment:
      BUZZ_AI_MODEL_NAME: CNN
      BUZZ_AI_MODEL_THRESHOLD: "0.7"
      BUZZ_DB_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  simulator:
    image: buzz-ai-server:local
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    command: ["python", "-m", "ai_server.app.workers.audio_simulator"]
    environment:
      BUZZ_AI_MODEL_NAME: CNN
      BUZZ_AI_MODEL_THRESHOLD: "0.7"
      BUZZ_SIMULATOR_AUDIO_ROOT: /app/data/audio_simulator
      BUZZ_SIMULATOR_API_URL: http://ai-server:8000/api/auto/analyze-batch
      BUZZ_SIMULATOR_INTERVAL_SECONDS: "2"
    volumes:
      - ./data/audio_simulator:/app/data/audio_simulator
    depends_on:
      ai-server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    image: buzz-web:local
    ports:
      - "5173:80"
    depends_on:
      ai-server:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
