    <path d="M14 25h22M18 18l14 14M32 18L18 32" stroke="#17324D" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="25" cy="25" r="6" fill="#17324D"/>
    <text x="68" y="29" font-size="32" font-weight="900" fill="#132E49">Buzz 시스템 아키텍처</text>
    <text x="68" y="52" font-size="14" font-weight="700" fill="#74869A">AI 음향 기반 말벌 감지 · 다중 사업장 관제</text>
  </g>
