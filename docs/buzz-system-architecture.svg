<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Buzz 시스템 아키텍처</title>
  <desc id="desc">사업장 음원과 사용자 요청이 Docker Compose의 시뮬레이터, 웹, FastAPI, CNN과 MySQL을 거쳐 웹과 Android 관제 화면으로 전달되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173A5E"/>
      <stop offset="1" stop-color="#0F2B47"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD45C"/>
      <stop offset="1" stop-color="#F4B723"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37C985"/>
      <stop offset="1" stop-color="#1D9B64"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18334D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#294D6D"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#E6A914"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .section { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; fill: #6B7D90; }
      .card-title { font-size: 22px; font-weight: 800; fill: #17324D; }
      .body { font-size: 16px; font-weight: 600; fill: #52667A; }
      .small { font-size: 14px; font-weight: 600; fill: #708196; }
      .micro { font-size: 12px; font-weight: 700; fill: #75879A; }
      .white { fill: #FFFFFF; }
      .chip { font-size: 13px; font-weight: 800; fill: #17324D; }
      .flow { fill: none; stroke: #294D6D; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowNavy); }
      .flow2 { fill: none; stroke: #E6A914; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAmber); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

